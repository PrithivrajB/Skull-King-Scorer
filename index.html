<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skull King Scorer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23010810'/%3E%3Cpath d='M50 15 C28 15 18 32 18 46 C18 58 24 66 34 70 L34 80 C34 83 37 85 40 85 L60 85 C63 85 66 83 66 80 L66 70 C76 66 82 58 82 46 C82 32 72 15 50 15Z' fill='%23e8a020'/%3E%3Ccircle cx='38' cy='47' r='9' fill='%23010810'/%3E%3Ccircle cx='62' cy='47' r='9' fill='%23010810'/%3E%3Crect x='38' y='74' width='6' height='12' rx='2' fill='%23010810'/%3E%3Crect x='47' y='74' width='6' height='12' rx='2' fill='%23010810'/%3E%3Crect x='56' y='74' width='6' height='12' rx='2' fill='%23010810'/%3E%3Cpath d='M41 63 L59 63' stroke='%23010810' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --gold: #e8a020; --gold-d: #b07818; --gold-l: #f5c84a;
  --ember: #c0392b;
  --cd: #0a0c10; --cm: #0d1520; --cl: #101c2a;
  --text: #e8d5a8; --dim: #7a6545;
  --danger: #aa1f1f; --ok: #0e9e70;
  --r: 12px; --sh: 0 8px 32px rgba(0,0,0,.8);
  --step: rgba(0,0,0,.65); --step-h: rgba(0,0,0,.85);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(0,30,60,.6) 0%, transparent 70%),
    radial-gradient(ellipse at 20% 80%, rgba(0,15,30,.8) 0%, transparent 60%),
    linear-gradient(180deg, #01050d 0%, #010810 40%, #000508 100%) fixed;
  color: var(--text);
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 16px;
}

/* Subtle bioluminescent particles */
body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(circle 1px at 15% 20%, rgba(232,160,32,.15) 0%, transparent 100%),
    radial-gradient(circle 1px at 75% 35%, rgba(232,160,32,.1) 0%, transparent 100%),
    radial-gradient(circle 1px at 40% 65%, rgba(0,180,120,.08) 0%, transparent 100%),
    radial-gradient(circle 1px at 85% 70%, rgba(232,160,32,.12) 0%, transparent 100%),
    radial-gradient(circle 1px at 25% 85%, rgba(0,120,180,.07) 0%, transparent 100%);
}

.hidden { display: none !important; }

/* ─── GLOBAL BAR — HAMBURGER ─── */
#global-bar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: flex-end;
  padding: 7px 14px;
  background: linear-gradient(90deg, rgba(1,5,13,.98) 0%, rgba(1,8,16,.98) 100%);
  border-bottom: 2px solid rgba(232,160,32,.3);
  box-shadow: 0 4px 24px rgba(0,0,0,.9);
  backdrop-filter: blur(8px);
}
#hbg-wrap { position: relative; }
#hbg-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 36px; border-radius: 7px;
  border: 2px solid rgba(232,160,32,.3); background: rgba(232,160,32,.06);
  color: var(--gold); cursor: pointer; transition: .2s; flex-direction: column; gap: 4px; padding: 8px 9px;
}
#hbg-btn:hover { background: rgba(232,160,32,.14); border-color: var(--gold); }
#hbg-btn span { display: block; width: 18px; height: 2px; background: currentColor; border-radius: 2px; transition: .25s; }
#hbg-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
#hbg-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
#hbg-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

#hbg-panel {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: linear-gradient(160deg, rgba(18,8,2,.97) 0%, rgba(4,18,36,.97) 100%);
  border: 2px solid rgba(232,160,32,.3); border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,.9); backdrop-filter: blur(12px);
  min-width: 170px; padding: 6px;
  opacity: 0; transform: translateY(-8px) scale(.97); pointer-events: none;
  transition: opacity .2s ease, transform .2s cubic-bezier(.34,1.4,.64,1);
  z-index: 200;
}
#hbg-panel.open { opacity: 1; transform: none; pointer-events: auto; }
.hbg-sep { height: 1px; background: rgba(232,160,32,.15); margin: 4px 0; }
.hbg-item {
  display: flex; align-items: center; gap: 9px;
  width: 100%; padding: 9px 13px; border-radius: 7px; border: none;
  background: transparent; color: var(--gold);
  font-family: 'Cinzel', serif; font-size: .82rem; font-weight: 600; letter-spacing: .3px;
  cursor: pointer; transition: background .15s, color .15s; text-align: left;
}
.hbg-item:hover { background: rgba(232,160,32,.12); color: #fff; }
.hbg-item.danger:hover { background: rgba(192,57,43,.25); color: #fff; }

/* ─── MODALS — animated ─── */
.mo {
  position: fixed; inset: 0; background: rgba(0,8,17,.0); z-index: 200;
  display: flex; align-items: center; justify-content: center; backdrop-filter: blur(0px);
  transition: background .22s ease, backdrop-filter .22s ease;
}
.mo.open { background: rgba(0,8,17,.88); backdrop-filter: blur(6px); }
.mb {
  background: linear-gradient(160deg, #1a0a00 0%, #0a2a4a 100%);
  border: 3px ridge var(--gold); border-radius: 16px;
  padding: 26px; max-width: 480px; width: 92%; box-shadow: 0 16px 48px rgba(0,0,0,.9);
  opacity: 0; transform: translateY(-18px) scale(.95);
  transition: opacity .25s ease, transform .28s cubic-bezier(.34,1.4,.64,1);
}
.mo.open .mb { opacity: 1; transform: none; }

/* ─── SCREENS ─── */
.screen { position: relative; z-index: 1; padding: 20px 16px 48px; max-width: 1440px; margin: 0 auto; }

h1.title {
  font-family: 'Cinzel', serif; font-size: clamp(1.8rem,5vw,3.2rem); font-weight: 900;
  color: var(--gold); text-align: center;
  text-shadow: 0 0 30px rgba(232,160,32,.5), 0 4px 8px rgba(0,0,0,.8);
  margin-bottom: 8px; letter-spacing: 3px;
}
.sub { text-align: center; color: var(--text); font-style: italic; font-size: 1.15rem; margin-bottom: 32px; opacity: .85; }

/* ─── SECTION CARD ─── */
.sc {
  background: linear-gradient(135deg,rgba(44,24,16,.85) 0%,rgba(10,42,74,.7) 100%);
  border: 2px solid rgba(232,160,32,.2); border-radius: var(--r);
  padding: 20px; margin-bottom: 20px; box-shadow: var(--sh); backdrop-filter: blur(6px);
}
.sc h2 {
  font-family: 'Cinzel', serif; font-size: 1.05rem; color: var(--gold); margin-bottom: 13px;
  border-bottom: 2px solid rgba(232,160,32,.2); padding-bottom: 7px; letter-spacing: .8px;
}

/* ─── INPUTS ─── */
label {
  font-family: 'Cinzel', serif; font-size: .68rem; color: var(--dim);
  display: block; margin-bottom: 3px; letter-spacing: .4px; font-weight: 700;
}
input[type=text], input[type=number], select {
  background: rgba(1,5,12,.8); border: 2px solid rgba(232,160,32,.25);
  border-radius: 6px; color: var(--text); padding: 7px 10px;
  font-family: 'Crimson Text', serif; font-size: .95rem; width: 100%; transition: border-color .2s;
}
input:focus, select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 8px rgba(232,160,32,.2); }
select option { background: #01080f; }

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Cinzel', serif; font-weight: 700; font-size: .82rem;
  padding: 9px 16px; border-radius: 8px; border: 2px solid var(--gold-d);
  background: linear-gradient(135deg, var(--gold) 0%, #d4a000 100%);
  color: #1a0a00; cursor: pointer; letter-spacing: .4px;
  transition: all .2s; white-space: nowrap;
}
.btn:hover { background: linear-gradient(135deg, var(--ember) 0%, #cc3000 100%); border-color: var(--ember); color: #fff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(255,69,0,.4); }
.btn:active { transform: none; }
.btn-sm { padding: 7px 13px; font-size: .78rem; border-radius: 6px; }
.btn-d { background: linear-gradient(135deg,#cc2222 0%,#990000 100%); border-color: #cc2222; color: #fff; }
.btn-d:hover { background: linear-gradient(135deg,#ff3333 0%,#cc0000 100%); }
.btn-g { background: transparent; border-color: rgba(232,160,32,.3); color: var(--gold); }
.btn-g:hover { background: rgba(232,160,32,.1); border-color: var(--gold); }

/* ─── STEPPERS ─── */
/* border is inset on the element → overflow:hidden clips children to border-radius,
   no bleed outside. box-sizing:border-box (global) ensures border doesn't add width. */
.stepper {
  display: flex; align-items: stretch;
  border: 2px solid rgba(232,160,32,.5); border-radius: 7px; overflow: hidden;
  height: 30px; background: transparent; flex-shrink: 0;
}
.sb {
  background: var(--step); border: none; color: var(--gold);
  width: 28px; flex-shrink: 0; cursor: pointer;
  font-size: 1rem; font-weight: 900; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background .14s; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.sb:hover { background: var(--step-h); color: var(--gold-l); }
.sb:active { background: rgba(0,0,0,.85); }
.sv {
  flex: 1; background: rgba(0,8,17,.6); color: var(--text);
  min-width: 28px; text-align: center; font-family: 'Cinzel', serif;
  font-weight: 700; font-size: .88rem;
  display: flex; align-items: center; justify-content: center;
  border-left: 2px solid rgba(232,160,32,.2); border-right: 2px solid rgba(232,160,32,.2);
  padding: 0 3px;
}

/* ─── RASCAL ─── */
.rg { display: flex; border-radius: 7px; overflow: hidden; border: 2px solid rgba(232,160,32,.4); }
.rb {
  flex: 1; background: rgba(0,8,17,.5); border: none; color: var(--dim);
  padding: 5px 3px; cursor: pointer; font-family: 'Cinzel', serif;
  font-weight: 700; font-size: .78rem; transition: all .14s;
  border-right: 2px solid rgba(232,160,32,.15);
}
.rb:last-child { border-right: none; }
.rb.on { background: var(--gold); color: #1a0a00; }
.rb:hover:not(.on) { background: rgba(232,160,32,.15); color: var(--text); }

/* ─── HOME ─── */
#hs { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.hc { flex: 1; min-width: 278px; }
#pis { display: flex; flex-direction: column; gap: 7px; margin-bottom: 11px; }
.pir { display: flex; gap: 7px; align-items: center; }
.pir input { flex: 1; }
#sl { display: flex; flex-direction: column; gap: 8px; }
.si {
  display: flex; align-items: center; gap: 9px; padding: 11px 14px;
  background: rgba(0,8,17,.5); border: 2px solid rgba(232,160,32,.15);
  border-radius: 10px; transition: .2s; cursor: pointer;
}
.si:hover { border-color: var(--gold); background: rgba(232,160,32,.05); }
.si-inf { flex: 1; }
.si-n { font-family: 'Cinzel', serif; font-weight: 600; font-size: .92rem; color: var(--gold); }
.si-m { font-size: .82rem; color: var(--text); opacity:.7; margin-top: 3px; font-style: italic; }

/* ─── COMPTE HEADER ─── */
#ch {
  display: flex; flex-wrap: wrap; gap: 9px; align-items: stretch;
  margin-bottom: 14px; padding: 10px 13px;
  background: rgba(1,5,12,.75); border: 2px solid rgba(232,160,32,.18); border-radius: var(--r);
}
#ch select { width: auto; min-width: 88px; }
#ri { font-family: 'Cinzel', serif; font-size: .84rem; font-weight: 600; color: var(--gold); flex: 1; align-self: center; }

/* ─── BUTIN BAR ─── */
.bb {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 13px; background: rgba(16,185,129,.08);
  border: 2px solid rgba(16,185,129,.3); border-radius: 10px; margin-bottom: 12px;
}
.bbl { font-family: 'Cinzel', serif; font-size: .74rem; font-weight: 700; color: #6ee7b7; white-space: nowrap; }

/* ─── CARDS GRID ─── */
#cg {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(256px,1fr));
  gap: 14px; margin-bottom: 18px;
}
@media (max-width:600px) { #cg { grid-template-columns: 1fr; } }

/* ─── PLAYER CARD ─── */
.pc {
  background: linear-gradient(135deg,rgba(44,24,16,.85) 0%,rgba(10,42,74,.7) 100%);
  border: 2px solid var(--gold);
  border-radius: var(--r); box-shadow: var(--sh), inset 0 1px 0 rgba(232,160,32,.06);
  transition: transform .3s, box-shadow .3s; cursor: grab; overflow: hidden;
  display: flex; flex-direction: column;
}
.pc:hover { transform: scale(1.02); box-shadow: var(--sh), 0 0 20px rgba(232,160,32,.18); }
.pc.dragging { opacity: .45; cursor: grabbing; }
.pc.dov { border-color: var(--ember); box-shadow: 0 0 20px rgba(255,69,0,.5); }
.pch {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px 5px; border-bottom: 2px solid rgba(232,160,32,.15);
  background: rgba(0,0,0,.35);
}
.cn {
  font-family: 'Cinzel Decorative', cursive; font-size: .88rem; font-weight: 700;
  min-width: 36px; outline: none; border-bottom: 2px dashed rgba(232,160,32,.3);
  text-shadow: 0 0 8px rgba(232,160,32,.3); flex: 1; margin: 0 6px;
}
.cn:focus { border-bottom-color: var(--gold); }
.dh { font-size: .95rem; color: var(--dim); cursor: grab; padding: 0 4px; user-select: none; }

/* Card body — tight */
.pcbody { padding: 7px 10px 5px; flex: 1; }
.cr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
.cf { display: flex; flex-direction: column; gap: 2px; }
.cf label { font-size: .7rem; }
.cf .stepper { width: 100%; }
/* Mise/Plis on the same line */
.mise-plis-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px;
}
.mise-plis-row .cf label { font-size: .72rem; }
.srow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; gap: 6px; }
.srow label { margin: 0; flex: 1; font-size: .72rem; }

/* Alliance info — only shows border when it has content */
.ai {
  margin-top: 5px; font-size: .72rem; color: #6ee7b7;
}
.ai.has-alliances {
  padding: 5px 8px;
  background: rgba(16,185,129,.07); border: 2px solid rgba(16,185,129,.2);
  border-radius: 7px;
}

/* Past round warning */
.past-warn {
  font-family: 'Cinzel', serif; font-size: .67rem; color: #fbbf24;
  background: rgba(251,191,36,.08); border-bottom: 2px solid rgba(251,191,36,.2);
  padding: 4px 10px; letter-spacing: .3px;
}
/* Bonus collapsible */

/* Card footer */
.pcf {
  background: rgba(0,0,0,.4); border-top: 2px solid rgba(232,160,32,.15);
  padding: 5px 10px; display: flex; justify-content: space-between;
  align-items: center; flex-wrap: wrap; gap: 3px;
}
.sm { font-family: 'Cinzel', serif; font-size: .7rem; color: var(--dim); }
.sv2 { font-family: 'Cinzel Decorative', cursive; font-weight: 900; font-size: .95rem; }
.sv2.p { color: var(--gold); text-shadow: 0 0 6px rgba(232,160,32,.4); }
.sv2.n { color: #f87171; }
.sv2.z { color: var(--dim); }
.cv { font-family: 'Cinzel', serif; font-size: .7rem; color: var(--text); font-weight: 600; }

/* ─── RANK BADGE ─── */
.rank-badge {
  font-family: 'Cinzel', serif; font-size: .65rem; font-weight: 700;
  padding: 1px 6px; border-radius: 99px; margin-left: 4px; white-space: nowrap;
}
.rank-1 { background: var(--gold); color: #1a0a00; }
.rank-2 { background: #c0c0c0; color: #111; }
.rank-3 { background: #cd7f32; color: #fff; }
.rank-o { background: rgba(255,255,255,.12); color: var(--dim); }

/* ─── SIDE PANEL (inline classement) ─── */
#side-panel {
  background: linear-gradient(135deg,rgba(44,24,16,.85) 0%,rgba(10,42,74,.7) 100%);
  border: 2px solid rgba(232,160,32,.3); border-radius: var(--r);
  padding: 0 14px; box-shadow: var(--sh); backdrop-filter: blur(4px);
  margin-bottom: 14px;
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height .38s cubic-bezier(.4,0,.2,1), opacity .28s ease, padding .3s ease;
}
#side-panel.open {
  max-height: 800px; opacity: 1; padding: 14px;
}
#side-panel h3 {
  font-family: 'Cinzel Decorative', cursive; font-size: .9rem; color: var(--gold);
  margin-bottom: 10px; text-align: center; letter-spacing: 1px;
}
#side-chart-wrap { height: 220px; margin-bottom: 12px; }
#side-chart-wrap canvas { max-height: 200px !important; }

/* ─── BONUS PANEL (per card) ─── */
.pc-bonus {
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height .35s cubic-bezier(.4,0,.2,1), opacity .25s ease;
  margin-top: 0;
}
.pc-bonus.open {
  max-height: 600px; opacity: 1; margin-top: 5px;
}

/* ─── WINNER BANNER ─── */
#winner-banner {
  text-align: center; margin-bottom: 22px; padding: 20px 24px;
  background: linear-gradient(135deg, rgba(44,24,16,.9) 0%, rgba(10,42,74,.8) 100%);
  border: 3px ridge var(--gold); border-radius: var(--r);
  box-shadow: 0 0 40px rgba(232,160,32,.25), var(--sh);
  animation: bannerIn .6s cubic-bezier(.34,1.56,.64,1);
}
#winner-banner .wb-title {
  font-family: 'Cinzel Decorative', cursive; font-size: clamp(1rem,3vw,1.6rem);
  color: var(--gold); text-shadow: 0 0 20px rgba(232,160,32,.6); margin-bottom: 8px;
}
#winner-banner .wb-name {
  font-family: 'Cinzel Decorative', cursive; font-size: clamp(1.4rem,4vw,2.4rem);
  font-weight: 900; color: var(--gold);
  text-shadow: 0 0 30px rgba(232,160,32,.7), 0 4px 8px rgba(0,0,0,.8);
  margin-bottom: 6px;
}
#winner-banner .wb-score {
  font-family: 'Cinzel', serif; font-size: 1rem; color: var(--dim); font-style: italic;
}
#winner-banner .wb-quote {
  font-family: 'Crimson Text', serif; font-size: 1.1rem; font-style: italic;
  color: #f5e6c8; margin-top: 10px; opacity: .85;
}
@keyframes bannerIn {
  from { opacity: 0; transform: translateY(-16px) scale(.95); }
  to   { opacity: 1; transform: none; }
}

/* Nav prev/next buttons — match select height exactly */
#ch .nav-group { display: flex; align-items: stretch; gap: 7px; }
#ch .nav-group .btn { padding-top: 0; padding-bottom: 0; align-self: stretch; }
#ch .nav-group select { align-self: stretch; }

/* Bonus input — editable field inside stepper */
.bonus-input {
  flex: 1; background: rgba(0,8,17,.6); color: var(--text);
  width: 0; min-width: 0; text-align: center; font-family: 'Cinzel', serif;
  font-weight: 700; font-size: .88rem; border: none; outline: none;
  border-left: 2px solid rgba(232,160,32,.2); border-right: 2px solid rgba(232,160,32,.2);
  padding: 0 4px;
}
.bonus-input:focus { background: rgba(232,160,32,.08); color: var(--gold); }
/* Hide browser spinners on bonus input */
.bonus-input::-webkit-inner-spin-button,
.bonus-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.bonus-input[type=number] { -moz-appearance: textfield; appearance: textfield; }

/* ─── COMPTE ACTIONS ─── */
#ca { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; padding: 10px 0; }
#ctw { overflow-x: auto; margin-bottom: 18px; border-radius: var(--r);
  border: 2px solid rgba(232,160,32,.2);
  background: linear-gradient(135deg,rgba(44,24,16,.85) 0%,rgba(10,42,74,.7) 100%); }
table { width: 100%; border-collapse: collapse; font-family: 'Cinzel', serif; }
th { background: rgba(0,0,0,.4); color: var(--gold); font-size: .76rem; font-weight: 700; padding: 10px 15px; text-align: left; border-bottom: 2px solid rgba(232,160,32,.25); letter-spacing: .4px; }
td { padding: 8px 15px; border-bottom: 1px solid rgba(232,160,32,.06); font-size: .9rem; color: var(--text); }
tr:nth-child(even) td { background: rgba(0,0,0,.2); }
tr:first-child td { background: rgba(232,160,32,.07); }
.rb2 { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-weight: 800; font-size: .83rem; }
.r1 { background: var(--gold); color: #111; } .r2 { background: #c0c0c0; color: #111; }
.r3 { background: #cd7f32; color: #fff; } .ro { background: rgba(255,255,255,.1); color: var(--dim); }
#cw2 {
  background: linear-gradient(135deg,rgba(44,24,16,.85) 0%,rgba(10,42,74,.7) 100%);
  border: 2px solid rgba(232,160,32,.2); border-radius: var(--r); padding: 16px; margin-bottom: 18px; height: 390px; }
#cw2 canvas { max-height: 350px !important; }
#cla { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }

/* ─── NOTIF ─── */
#notif {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: linear-gradient(135deg, rgba(44,24,16,.97), rgba(10,42,74,.97));
  border: 2px solid var(--gold); border-radius: 10px;
  padding: 10px 20px; font-family: 'Cinzel', serif; font-size: .84rem; font-weight: 600; color: var(--gold);
  z-index: 999; transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  box-shadow: var(--sh); white-space: nowrap;
}
#notif.on { transform: translateX(-50%) translateY(0); }

/* ─── MODALS — shared ─── */
.mb h2 { font-family: 'Cinzel Decorative', cursive; font-size: 1.1rem; color: var(--gold); margin-bottom: 13px; }
.mb p { font-family: 'Crimson Text', serif; font-size: 1.05rem; color: var(--text); margin-bottom: 18px; line-height: 1.7; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.ma { display: flex; gap: 9px; justify-content: flex-end; flex-wrap: wrap; }
.mf { margin-bottom: 13px; }
.mf label { margin-bottom: 4px; }
.ar { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; padding: 9px 11px;
  background: rgba(16,185,129,.08); border: 2px solid rgba(16,185,129,.2); border-radius: 8px; }
.ar select { width: auto; flex: 1; font-size: .85rem; }
.ar .sep { font-family: 'Cinzel', serif; font-size: .75rem; color: var(--dim); font-weight: 600; white-space: nowrap; }

.nsep { height: 1px; background: linear-gradient(90deg,transparent,rgba(232,160,32,.25),transparent); margin: 7px 0; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,.2); }
::-webkit-scrollbar-thumb { background: rgba(232,160,32,.3); border-radius: 3px; }
</style>
</head>

<script>
// ──────────────────────────────────────────────────────────────
//  SVG ICONS  (Lucide-style, 24×24 viewBox)
// ──────────────────────────────────────────────────────────────
const ICONS = {
  home:    `<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>`,
  trash:   `<polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/><path d="M9,6V4a1,1,0,0,1,1-1h4a1,1,0,0,1,1,1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>`,
  logout:  `<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/>`,
  anchor:  `<circle cx="12" cy="5" r="3"/><line x1="12" y1="8" x2="12" y2="21"/><path d="M5 15H2a10 10 0 0020 0h-3"/>`,
  users:   `<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>`,
  scroll:  `<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="15" y2="11"/>`,
  plus:    `<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>`,
  zap:     `<polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2"/>`,
  back:    `<polyline points="15,18 9,12 15,6"/>`,
  fwd:     `<polyline points="9,18 15,12 9,6"/>`,
  dice:    `<rect x="2" y="2" width="20" height="20" rx="4"/><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/>`,
  chart:   `<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/>`,
  save:    `<path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/>`,
  trophy:  `<polyline points="8,21 12,17 16,21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M7 4h10l-1 7a5 5 0 01-8 0L7 4z"/><path d="M5 4H3v3a4 4 0 003.5 3.97"/><path d="M19 4h2v3a4 4 0 01-3.5 3.97"/>`,
  x:       `<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`,
  check:   `<polyline points="20,6 9,17 4,12"/>`,
  grip:    `<circle cx="9" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1" fill="currentColor" stroke="none"/>`,
  skull:   `<path d="M12 2a9 9 0 017 14.93V20a2 2 0 01-2 2H7a2 2 0 01-2-2v-3.07A9 9 0 0112 2z"/><line x1="8" y1="22" x2="8" y2="19"/><line x1="12" y1="22" x2="12" y2="19"/><line x1="16" y1="22" x2="16" y2="19"/><circle cx="9" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.5" fill="currentColor" stroke="none"/>`,
  sword:   `<polyline points="14.5,17.5 3,6 3,3 6,3 17.5,14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/>`,
  play:    `<polygon points="5,3 19,12 5,21 5,3"/>`,
  warning: `<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>`,
  handshake:`<path d="M15.5 7.5L12 4 8.5 7.5"/><path d="M12 4v9"/><path d="M9 13H7a2 2 0 00-2 2v4h14v-4a2 2 0 00-2-2h-2"/>`,
  gift:    `<polyline points="20,12 20,22 4,22 4,12"/><rect x="2" y="7" width="20" height="5"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>`,
  mask:    `<path d="M3 7c0-1.1.9-2 2-2h14a2 2 0 012 2v5c0 4.4-3.6 8-8 8s-8-3.6-8-8V7z"/><path d="M9 11c0 1.1.9 2 2 2h2a2 2 0 000-4H9v2z"/>`,
};
function ico(name, sz=15) {
  const p = ICONS[name]||'';
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0">${p}</svg>`;
}

// ──────────────────────────────────────────────────────────────
//  SONAR PLUGIN  (replaces grid with concentric radar arcs)
// ──────────────────────────────────────────────────────────────
const sonarPlugin = {
  id: 'sonar',
  beforeDraw(chart) {
    const { ctx, chartArea: ca } = chart;
    if (!ca) return;
    const cx = (ca.left + ca.right) / 2, cy = ca.bottom;
    const maxR = Math.hypot(ca.right - ca.left, ca.bottom - ca.top) * 1.05;
    ctx.save();
    ctx.beginPath(); ctx.rect(ca.left, ca.top, ca.right - ca.left, ca.bottom - ca.top); ctx.clip();
    // Concentric arcs
    const rings = 7;
    for (let i = 1; i <= rings; i++) {
      const r = (maxR / rings) * i;
      ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0);
      const alpha = 0.03 + i * 0.025;
      ctx.strokeStyle = `rgba(232,160,32,${alpha})`; ctx.lineWidth = 1; ctx.stroke();
    }
    // Radial spokes
    const spokes = 10;
    for (let i = 0; i <= spokes; i++) {
      const ang = Math.PI + (Math.PI / spokes) * i;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(ang) * maxR, cy + Math.sin(ang) * maxR);
      ctx.strokeStyle = 'rgba(232,160,32,0.04)'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
  }
};
Chart.register(sonarPlugin);

// ──────────────────────────────────────────────────────────────
//  CONSTANTS
// ──────────────────────────────────────────────────────────────
const PCOLORS = ['#fbbf24','#ef4444','#3b82f6','#10b981','#8b5cf6','#ec4899','#f97316','#06b6d4','#84cc16','#a78bfa'];

const BOUNDS = {
  mise:       N => ({ min:0, max:N }),
  plis:       N => ({ min:0, max:N }),
  pirate:     () => ({ min:0, max:7 }),
  sk:         () => ({ min:0, max:1 }),

// ──────────────────────────────────────────────────────────────
//  RANKING — standard competition ranking (1224 / "olympic")
//  Tied players share the same rank; next rank skips accordingly.
//  e.g. A30 B30 C28 D30 → sorted: A30 B30 D30 C28 → ranks 1 1 1 4
// ──────────────────────────────────────────────────────────────
function computeRanks(entries) {
  // entries: [{ pid, score, ... }], sorted descending by score already
  // Returns same array with .rank added
  const sorted = [...entries].sort((a, b) => b.score - a.score);
  let rank = 1;
  for (let i = 0; i < sorted.length; i++) {
    if (i > 0 && sorted[i].score < sorted[i-1].score) rank = i + 1;
    sorted[i].rank = rank;
  }
  return sorted;
}

function rankClass(rank) {
  return rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : 'ro';
}
function rankBadgeClass(rank) {
  return rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-o';
}
function rankMedal(rank) {
  return rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
}

function getStandings(ri) {
  // Returns map { pid: rank } based on cumuls at end of round ri
  const entries = state.playerOrder.map(pid => ({
    pid, score: state.cumuls[pid]?.[ri] ?? 0
  }));
  const ranked = computeRanks(entries);
  const map = {};
  ranked.forEach(e => { map[e.pid] = e.rank; });
  return map;
}

// ──────────────────────────────────────────────────────────────
//  SCORING
// ──────────────────────────────────────────────────────────────
function calcScore(data, N, allJoueurs=[]) {
  const i = v => parseInt(v) || 0;
  const mise = i(data.mise), plis = i(data.plis);
  const pirate = Math.min(i(data.pirate), 7);
  const sk = Math.min(i(data.sk), 1);
  const sirene = Math.min(i(data.sirene), 2);
  const lev = Math.min(i(data.leviathan), 10);
  // backward-compat: booleans from old saves
  const got8 = typeof data.got8==='boolean' ? (data.got8?1:0) : Math.min(i(data.got8), 4);
  const got7 = typeof data.got7==='boolean' ? (data.got7?1:0) : Math.min(i(data.got7), 4);
  const g14c = Math.min(i(data.got14color), 3);
  const g14b = Math.min(i(data.got14black), 1);
  const bonus = i(data.bonus);
  const rascal = (data.rascal===null||data.rascal===undefined||data.rascal==='null')
    ? null : parseInt(data.rascal);

  const bidOk = d => {
    const m = parseInt(d.mise)||0, p = parseInt(d.plis)||0;
    return (m===0 && p===0) || (m>=1 && p===m);
  };
  const ok = bidOk(data);

  // Base
  let base = 0;
  if (mise===0 && plis===0) base = 10*N;               // bid=0 réussi
  else if (mise===0 && plis>0) base = -10*N;            // bid=0 raté → pénalité = -10 × cartes distribuées
  else if (mise>=1 && plis===mise) base = 20*plis;      // mise réussie
  else base = -10*Math.abs(mise-plis);                  // mise ratée

  // Bonus
  let bon = 0;
  if (ok) {
    bon += pirate*20 + sk*40 + sirene*30 + lev*20;
    bon += got8*5 - got7*5;
    bon += g14c*10 + g14b*20 + bonus;

    // Alliance bonus : +20 par alliance SEULEMENT si les 2 joueurs ont rempli leur contrat
    const butins = data.butins || [];
    const pid = data.id;
    if (pid) {
      butins.forEach(a => {
        if (a.playerA===pid || a.playerB===pid) {
          const partnerId = a.playerA===pid ? a.playerB : a.playerA;
          const partner = allJoueurs.find(j => j.id===partnerId);
          // If partner data available, check their bid; if not (pure calc), grant bonus
          if (!partner || bidOk(partner)) bon += 20;
        }
      });
    }
  }

  // Rascal
  let rv = 0;
  if (rascal!==null && !isNaN(rascal)) rv = ok ? rascal : -rascal;

  return base + bon + rv;
}

function calcCard(inp) {
  const N = state ? state.currentRound : 1;
  const m = state ? state.manches[N-1] : null;
  return calcScore({ ...inp, butins: m ? (m.butins||[]) : [] }, N, m ? m.joueurs : []);
}

// ──────────────────────────────────────────────────────────────
//  CUMULS
// ──────────────────────────────────────────────────────────────
function recalcCumuls(from) {
  if (!state.cumuls) state.cumuls = {};
  state.playerOrder.forEach(pid => { if (!state.cumuls[pid]) state.cumuls[pid] = []; });
  for (let m = from; m < state.manches.length; m++) {
    const mn = state.manches[m];
    state.playerOrder.forEach(pid => {
      const prev = m===0 ? 0 : (state.cumuls[pid][m-1]||0);
      const jd = mn.joueurs.find(j => j.id===pid);
      state.cumuls[pid][m] = prev + (jd ? (jd.score||0) : 0);
    });
  }
}

function sk(id) { return 'skull_session_'+id; }

function listSessions() {
  const list = document.getElementById('sl');
  list.innerHTML = '';
  const ss = getAllSessions();
  if (!ss.length) {
    list.innerHTML = '<p style="color:var(--dim);font-style:italic;font-size:.87rem">Aucune partie sauvegardée</p>';
  }
  ss.sort((a,b) => (b.createdAt||b.updatedAt||'').localeCompare(a.createdAt||a.updatedAt||'')).forEach(s => {
    const el = document.createElement('div');
    el.className = 'si';
    el.innerHTML = `
      <div class="si-inf">
        <div class="si-n">${s.name} <span style="color:var(--dim);font-size:.72rem">(manche ${s.currentRound||1}/${s.config.manches})</span></div>
        <div class="si-m">${s.players.length} joueurs · ${new Date(s.updatedAt).toLocaleDateString('fr-FR')}</div>
      </div>
      <button class="btn btn-sm" onclick="loadSession('${s.id}');event.stopPropagation()">${ico('play',12)} Jouer</button>
      <button class="btn btn-d btn-sm" onclick="deleteSession('${s.id}');event.stopPropagation()">${ico('trash',12)}</button>`;
    el.onclick = () => loadSession(s.id);
    list.appendChild(el);
  });
  const cw = document.getElementById('cw');
  const act = ss.find(s => s.current);
  cw.innerHTML = act
    ? `<button class="btn" style="width:100%" onclick="loadSession('${act.id}')">${ico('play',14)} Continuer — ${act.name}</button>`
    : '';
}

function getAllSessions() {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('skull_session_')) {
      try { out.push(JSON.parse(localStorage.getItem(k))); } catch(e) {}
    }
  }
  return out;
}

function loadSession(id) {
  const raw = localStorage.getItem(sk(id));
  if (!raw) { notify('Session introuvable'); return; }
  getAllSessions().forEach(s => {
    if (s.id !== id && s.current) { s.current = false; localStorage.setItem(sk(s.id), JSON.stringify(s)); }
  });
  state = JSON.parse(raw);
  state.current = true;
  if (!state.currentRound) state.currentRound = 1;
  if (!state.maxReached) state.maxReached = state.currentRound;
  // Migrate old data
  state.manches.forEach(m => {
    if (!m.butins) m.butins = [];
    m.joueurs.forEach(j => {
      if (typeof j.got8==='boolean') j.got8 = j.got8?1:0;
      if (typeof j.got7==='boolean') j.got7 = j.got7?1:0;
      if (j.leviathan===undefined) j.leviathan = j.davy||0;
      if (j.got14color===undefined) j.got14color = 0;
      if (j.got14black===undefined) j.got14black = 0;
    });
  });
  // Ensure player colors
  state.players.forEach((p,i) => { if (!p.color) p.color = PCOLORS[i % PCOLORS.length]; });
  saveGame();
  showScreen('compte');
  renderCards();
}

function saveGame() {
  if (!state) return;
  state.updatedAt = new Date().toISOString();
  localStorage.setItem(sk(state.id), JSON.stringify(state));
}

function deleteSession(id) {
  openConfirm('Supprimer ?', 'Cette partie sera définitivement supprimée.', () => {
    if (state && state.id === id) state = null;
    localStorage.removeItem(sk(id));
    notify('Partie supprimée'); listSessions();
  });
}

  document.querySelectorAll('#pis .pin').forEach((inp, i) => {
    if (!inp.value) inp.placeholder = `Joueur ${i+1}`;
  });

function startNewGame() {
  const manches = parseInt(document.getElementById('nbm').value)||10;
  if (manches<1||manches>10) { alert('Nombre de manches invalide (1–10)'); return; }

  const names = [];
  document.querySelectorAll('.pin').forEach(inp => {
    const v = inp.value.trim(); if (v && !names.includes(v)) names.push(v);
  });
  if (names.length < 2) { alert('Il faut au minimum 2 joueurs !'); return; }
  if (names.length > 10) { alert('Maximum 10 joueurs'); return; }

  getAllSessions().forEach(s => { if (s.current) { s.current=false; localStorage.setItem(sk(s.id), JSON.stringify(s)); }});

  const now = new Date(); const id = Date.now().toString();
  const players = names.map((n,i) => ({ id:'p'+i+'_'+id, nom:n, color:PCOLORS[i%PCOLORS.length] }));
  const playerOrder = players.map(p => p.id);

  const manchesArr = [];
  for (let m = 1; m <= manches; m++)
    manchesArr.push({ N:m, butins:[], joueurs: players.map(p => emptyJ(p.id,p.nom)) });

  const cumuls = {};
  playerOrder.forEach(pid => { cumuls[pid] = new Array(manches).fill(0); });

  const pad = n => String(n).padStart(2,'0');
  const name = `Partie ${pad(now.getDate())}/${pad(now.getMonth()+1)} ${pad(now.getHours())}h${pad(now.getMinutes())} - ${players.length} joueurs`;

  state = { schemaVersion:1, id, name, createdAt:now.toISOString(), updatedAt:now.toISOString(),
    currentRound:1, maxReached:1, playerOrder, config:{manches}, players, manches:manchesArr, cumuls, current:true };

  saveGame(); showScreen('compte'); renderCards();
}

function emptyJ(id, nom) {
  return { id, nom, mise:0, plis:0, pirate:0, sk:0, sirene:0, leviathan:0,
    rascal:null, got7:0, got8:0, got14color:0, got14black:0, bonus:0, score:0 };
}

function pLabel(pid) {
  if (!state) return '';
  const p = state.players.find(p => p.id === pid);
  return p ? p.nom : '?';
}
function pColor(pid) {
  const p = state && state.players.find(p => p.id===pid);
  return p && p.color ? p.color : PCOLORS[0];
}

// ──────────────────────────────────────────────────────────────
//  ADD PLAYER MID-GAME
// ──────────────────────────────────────────────────────────────
function addPlayerToGame() { openAddPlayer(); }

function addPlayerNamed(nom) {
  if (!state) return;
  if (state.players.length >= 10) { alert('Maximum 10 joueurs'); return; }
  const trimmed = nom.trim(); if (!trimmed) return;
  if (state.players.find(p => p.nom===trimmed)) { alert('Ce joueur existe déjà'); return; }
  const pid = 'p'+uid();
  const color = PCOLORS[state.players.length % PCOLORS.length];
  state.players.push({ id:pid, nom:trimmed, color });
  state.playerOrder.push(pid);
  state.manches.forEach(m => { m.joueurs.push(emptyJ(pid, trimmed)); });
  state.cumuls[pid] = new Array(state.config.manches).fill(0);
  recalcCumuls(0); saveGame(); renderCards();
  notify(`👤 ${pLabel(pid)} ajouté(e)`);
}

// ──────────────────────────────────────────────────────────────
//  BUTIN STEPPER
// ──────────────────────────────────────────────────────────────
function stepButin(delta) {
  if (!state) return;
  const manche = state.manches[state.currentRound-1];
  if (!manche.butins) manche.butins = [];
  const cur = manche.butins.length;
  const nv = Math.max(0, Math.min(2, cur+delta));
  if (nv === cur) return;

  if (nv > cur) {
    // Add alliance with first two players as default, open panel to let user adjust
    const p0 = state.players[0]?.id || '';
    const p1 = state.players[1]?.id || '';
    manche.butins.push({ playerA: p0, playerB: p1 });
    document.getElementById('alliance-panel').classList.remove('hidden');
  } else {
    manche.butins.splice(cur-1, 1);
  }
  updateButinDisplay();
  recalcManche();
  renderAllianceInfoOnCards();
  renderAlliancePanel();
  sched();
}

function updateButinDisplay() {
  if (!state) return;
  const n = (state.manches[state.currentRound-1].butins||[]).length;
  document.getElementById('bc').textContent = n;
  document.getElementById('bea').style.display = n > 0 ? 'inline-flex' : 'none';
  if (n === 0) document.getElementById('alliance-panel').classList.add('hidden');
}

function recalcManche() {
  if (!state) return;
  const ri = state.currentRound-1;
  const m = state.manches[ri];
  m.joueurs.forEach(jd => {
    jd.score = calcScore({ ...jd, butins: m.butins||[] }, state.currentRound, m.joueurs);
  });
  recalcCumuls(ri);
  m.joueurs.forEach(jd => { updateCardScores(jd.id, ri); });
}

// ──────────────────────────────────────────────────────────────
//  RENDER CARDS
// ──────────────────────────────────────────────────────────────
function renderCards() {
  if (!state) return;
  const ri = state.currentRound-1, N = state.currentRound;
  const manche = state.manches[ri];

  // Header — show rounds 1..maxReached (currentRound is the highest ever reached)
  const maxReached = state.maxReached || state.currentRound;
  const sel = document.getElementById('rs');
  sel.innerHTML = '';
  for (let i=1; i<=maxReached; i++) {
    const o = document.createElement('option');
    o.value=i; o.textContent=`Manche ${i}`;
    if (i===N) o.selected=true;
    sel.appendChild(o);
  }
  document.getElementById('ri').textContent = `Manche ${N} / ${state.config.manches} · ${state.playerOrder.length} joueurs`;
  updateButinDisplay();
  renderAlliancePanel();

  const grid = document.getElementById('cg');
  grid.innerHTML = '';

  state.playerOrder.forEach((pid, pidx) => {
    const player = state.players.find(p => p.id===pid);
    const color = pColor(pid);
    const jd = manche.joueurs.find(j => j.id===pid) || emptyJ(pid, player?player.nom:'?');
    // Always recalc score on render (fixes mise=0 plis=0 → 10*N showing 0)
    jd.score = calcScore({ ...jd, butins: manche.butins||[] }, N, manche.joueurs);
    const cumul = state.cumuls[pid] ? (state.cumuls[pid][ri]||0) : 0;
    // Score displayed in header = cumul at END of PREVIOUS manche
    const prevCumul = ri > 0 ? (state.cumuls[pid]?.[ri-1] ?? 0) : null;
    // Rank based on previous manche cumuls
    const standings = ri > 0 ? getStandings(ri-1) : null;
    const rank = standings ? standings[pid] : null;
    const rankClass_ = rank ? rankBadgeClass(rank) : 'rank-o';
    const rankMedal_ = rank ? rankMedal(rank) : '';

    const sc = jd.score>0 ? 'p' : jd.score<0 ? 'n' : 'z';
    const rv = jd.rascal===null ? 'null' : String(jd.rascal);

    const card = document.createElement('div');
    card.className = 'pc'; card.dataset.pid=pid; card.dataset.pidx=pidx; card.draggable=true;
    card.style.borderColor = color;

    const isPast = N < (state.maxReached||1);
    const expanded = cardsExpanded;

    const headerScoreHtml = prevCumul !== null
      ? `<span id="chs-${pid}" style="font-family:'Cinzel',serif;font-size:.75rem;font-weight:700;color:var(--dim);white-space:nowrap">
           <span class="rank-badge ${rankClass_}">${rankMedal_}</span>
           <span id="chc-${pid}" style="color:${prevCumul>=0?'var(--gold)':'#f87171'}">${prevCumul>0?'+':''}${prevCumul}</span>
         </span>`
      : `<span id="chs-${pid}" style="font-family:'Cinzel',serif;font-size:.72rem;color:var(--dim)">M1</span>`;

    card.innerHTML = `
      <div class="pch">
        <span class="dh">${ico('grip',14)}</span>
        <span class="cn" contenteditable="true" data-pid="${pid}" style="color:${color}">${player?player.nom:'?'}</span>
        ${headerScoreHtml}
        <button class="btn btn-d btn-sm" style="padding:3px 7px;margin-left:4px" onclick="removePlayer('${pid}')">${ico('x',12)}</button>
      </div>
      ${isPast ? `<div class="past-warn">${ico('warning',12)} Manche passée — modification recalcule les cumuls</div>` : ''}
      <div class="pcbody">
        <div class="mise-plis-row">
          ${sField('Mise (0–'+N+')', pid,'mise',jd.mise)}
          ${sField('Plis (0–'+N+')', pid,'plis',jd.plis)}
        </div>
        <div class="ai" id="ai-${pid}"></div>
        <div class="pc-bonus ${expanded?'open':''}">
          <div class="cr">
            ${sField('Pirates (+20)',pid,'pirate',jd.pirate)}
            ${sField('Skull King (+40)',pid,'sk',jd.sk)}
          </div>
          <div class="cr">
            ${sField('Sirènes (+30)',pid,'sirene',jd.sirene)}
            ${sField('Léviathans (+20)',pid,'leviathan',jd.leviathan)}
          </div>
          <div class="cr">
            ${sField('7 capturé (−5)',pid,'got7',jd.got7)}
            ${sField('8 capturé (+5)',pid,'got8',jd.got8)}
          </div>
          <div class="cr">
            ${sField('14 couleur (+10)',pid,'got14color',jd.got14color)}
            ${sField('14 noir (+20)',pid,'got14black',jd.got14black)}
          </div>
          <div style="margin-bottom:7px">
            <label>Rascal</label>
            <div class="rg">
              <button class="rb ${rv==='null'?'on':''}" data-v="null" onclick="setRascal('${pid}','null',this)">Aucun</button>
              <button class="rb ${rv==='0'?'on':''}" data-v="0" onclick="setRascal('${pid}','0',this)">0</button>
              <button class="rb ${rv==='10'?'on':''}" data-v="10" onclick="setRascal('${pid}','10',this)">10</button>
              <button class="rb ${rv==='20'?'on':''}" data-v="20" onclick="setRascal('${pid}','20',this)">20</button>
            </div>
          </div>
          ${sRow('Bonus manuel', pid,'bonus',jd.bonus)}
        </div>
      </div>
      <div class="pcf">
        <span class="sm">Manche : <span class="sv2 ${sc}" id="sm-${pid}">${jd.score}</span> pts</span>
        <span class="cv">Cumul : <strong id="sc-${pid}">${cumul}</strong> pts</span>
      </div>`;

    grid.appendChild(card);

    // Name edit
    const ne = card.querySelector('.cn');
    ne.addEventListener('blur', () => {
      const nv = ne.textContent.trim();
      if (nv) {
        const p = state.players.find(p=>p.id===pid);
        if (p) p.nom = nv;
        state.manches.forEach(m => { const jj=m.joueurs.find(j=>j.id===pid); if(jj) jj.nom=nv; });
        sched();
      }
    });

    // Drag
    card.addEventListener('dragstart', e => { dragSrc=pidx; card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('dov'); });
    card.addEventListener('dragleave', () => card.classList.remove('dov'));
    card.addEventListener('drop', e => { e.preventDefault(); card.classList.remove('dov'); dragReorder(dragSrc, parseInt(card.dataset.pidx)); });
  });

  renderAllianceInfoOnCards();
  if (splitView) renderSidePanel();
}

function sRow(lbl, pid, field, val) {
  // Bonus uses cf layout (label above, stepper full-width) to avoid responsive issues
  const html = field === 'bonus' ? sBonusHTML(pid, val) : sHTML(pid, field, val);
  return `<div class="cf" style="margin-bottom:7px"><label>${lbl}</label>${html}</div>`;
}
function sField(lbl, pid, field, val) {
  return `<div class="cf"><label>${lbl}</label>${sHTML(pid,field,val)}</div>`;
}
function sHTML(pid, field, val) {
  return `<div class="stepper">
    <button class="sb" onclick="stepField('${pid}','${field}',-1)">−</button>
    <span class="sv" id="sv-${pid}-${field}">${val}</span>
    <button class="sb" onclick="stepField('${pid}','${field}',1)">+</button>
  </div>`;
}
function sBonusHTML(pid, val) {
  return `<div class="stepper">
    <button class="sb" onclick="stepField('${pid}','bonus',-5)">−</button>
    <input class="bonus-input" id="sv-${pid}-bonus" type="number" value="${val}"
      onchange="setBonusInput('${pid}', this.value)"
      oninput="setBonusInput('${pid}', this.value)"
      onclick="this.select()">
    <button class="sb" onclick="stepField('${pid}','bonus',5)">+</button>
  </div>`;
}

function renderAllianceInfoOnCards() {
  if (!state) return;
  const manche = state.manches[state.currentRound-1];
  const butins = manche.butins||[];
  state.playerOrder.forEach(pid => {
    const el = document.getElementById('ai-'+pid); if (!el) return;
    const lines = [];
    butins.forEach((b, globalIdx) => {
      if (b.playerA!==pid && b.playerB!==pid) return;
      const partId = b.playerA===pid ? b.playerB : b.playerA;
      const part = state.players.find(p=>p.id===partId);
      const c = pColor(partId);
      lines.push(`<div style="display:flex;align-items:center;gap:5px;${lines.length>0?'margin-top:3px':''}">
        <span>Butin ${globalIdx+1} : avec <strong style="color:${c}">${part?part.nom:'?'}</strong></span></div>`);
    });
    if (lines.length) {
      el.classList.add('has-alliances');
      el.innerHTML = lines.join('');
    } else {
      el.classList.remove('has-alliances');
      el.innerHTML = '';
    }
  });
}

// ──────────────────────────────────────────────────────────────
//  STEP FIELD
// ──────────────────────────────────────────────────────────────
function stepField(pid, field, delta) {
  if (!state) return;
  const N = state.currentRound, ri = N-1;
  const manche = state.manches[ri];
  const jd = manche.joueurs.find(j=>j.id===pid); if (!jd) return;
  const b = BOUNDS[field] ? BOUNDS[field](N) : {min:-999,max:999};
  const nv = Math.max(b.min, Math.min(b.max, (parseInt(jd[field])||0)+delta));
  jd[field] = nv;
  const el = document.getElementById(`sv-${pid}-${field}`);
  if (el) { if (el.tagName === 'INPUT') el.value = nv; else el.textContent = nv; }
  jd.score = calcScore({ ...jd, butins: manche.butins||[] }, N);
  recalcCumuls(ri);          // ← recalcul D'ABORD
  updateCardScores(pid, ri); // ← affichage APRÈS
  sched();
}

function setBonusInput(pid, rawVal) {
  if (!state) return;
  const N = state.currentRound, ri = N-1;
  const manche = state.manches[ri];
  const jd = manche.joueurs.find(j=>j.id===pid); if (!jd) return;
  const v = parseInt(rawVal);
  jd.bonus = isNaN(v) ? 0 : Math.max(-999, Math.min(999, v));
  jd.score = calcScore({ ...jd, butins: manche.butins||[] }, N);
  recalcCumuls(ri);
  updateCardScores(pid, ri);
  sched();
}

function setRascal(pid, val, btn) {
  if (!state) return;
  const ri = state.currentRound-1;
  const manche = state.manches[ri];
  const jd = manche.joueurs.find(j=>j.id===pid); if (!jd) return;
  const cur = jd.rascal===null ? 'null' : String(jd.rascal);
  jd.rascal = (cur===val) ? null : (val==='null' ? null : parseInt(val));
  const cv = jd.rascal===null ? 'null' : String(jd.rascal);
  btn.closest('.rg').querySelectorAll('.rb').forEach(b => b.classList.toggle('on', b.dataset.v===cv));
  jd.score = calcScore({ ...jd, butins: manche.butins||[] }, state.currentRound);
  recalcCumuls(ri);
  updateCardScores(pid, ri);
  sched();
}

function toggleBonusFields() {
  cardsExpanded = !cardsExpanded;
  document.querySelectorAll('.pc-bonus').forEach(el => el.classList.toggle('open', cardsExpanded));
  const btn = document.getElementById('btn-expand');
  const diceIco = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="4"/><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/></svg>`;
  if (btn) btn.innerHTML = cardsExpanded ? diceIco+' Réduire' : diceIco+' Bonus';
}

function updateCardScores(pid, ri) {
  const jd = state.manches[ri].joueurs.find(j=>j.id===pid); if (!jd) return;
  const sm = document.getElementById('sm-'+pid);
  const sc = document.getElementById('sc-'+pid);
  const chc = document.getElementById('chc-'+pid);
  const cumul = state.cumuls[pid]?.[ri] ?? 0;
  if (sm) { sm.textContent=jd.score; sm.className='sv2 '+(jd.score>0?'p':jd.score<0?'n':'z'); }
  if (sc) sc.textContent = cumul;
  // Header shows prevCumul (cumul at end of previous manche)
  if (chc && ri > 0) {
    const prev = state.cumuls[pid]?.[ri-1] ?? 0;
    chc.textContent = (prev>0?'+':'')+prev;
    chc.style.color = prev >= 0 ? 'var(--gold)' : '#f87171';
  }
  if (splitView) renderSidePanel();
}

// ──────────────────────────────────────────────────────────────
//  ROUND NAV
// ──────────────────────────────────────────────────────────────
function loadRound(n) {
  if (!state) return;
  state.currentRound = Math.max(1, Math.min(n, state.config.manches));
  renderCards();
}
function prevRound() { if (state && state.currentRound>1) loadRound(state.currentRound-1); }
function nextRound() {
  if (!state) return;
  recalcCumuls(state.currentRound-1);
  if (state.currentRound < state.config.manches) {
    state.currentRound++;
    state.maxReached = Math.max(state.maxReached||1, state.currentRound);
    saveGame();
    renderCards();
    notify(`Manche ${state.currentRound} chargée`);
  } else {
    // Last manche — save and show end-game modal (same as saveRound)
    saveGame();
    setTimeout(checkWinner, 100);
  }
}

function saveRound() {
  if (!state) return;
  const ri = state.currentRound-1;
  recalcCumuls(ri);
  saveGame();
  const isPast = state.currentRound < (state.maxReached||1);
  notify(isPast
    ? `Manche ${state.currentRound} sauvegardée · Cumuls recalculés`
    : `Manche ${state.currentRound} sauvegardée`);
  if (state.currentRound === state.config.manches) setTimeout(checkWinner, 350);
}

function checkWinner() {
  const li = state.config.manches - 1;
  const raw = state.playerOrder.map(pid => ({
    pid, color: pColor(pid),
    nom: (state.players.find(p=>p.id===pid)||{}).nom||'?',
    score: state.cumuls[pid] ? (state.cumuls[pid][li]||0) : 0
  }));
  const ranked = computeRanks(raw);
  const winners = ranked.filter(s => s.rank === 1);
  const pts = winners[0].score;
  const n = winners.length;

  const trophyIco = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><polyline points="8,21 12,17 16,21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M7 4h10l-1 7a5 5 0 01-8 0L7 4z"/><path d="M5 4H3v3a4 4 0 003.5 3.97"/><path d="M19 4h2v3a4 4 0 01-3.5 3.97"/></svg>`;
  const equalIco = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:middle;margin-right:6px"><line x1="5" y1="9" x2="19" y2="9"/><line x1="5" y1="15" x2="19" y2="15"/></svg>`;

  let msg;
  if (n === 1) {
    msg = `${trophyIco}<strong style="color:${winners[0].color}">${winners[0].nom}</strong> remporte la partie avec <strong>${pts} pts</strong> !`;
  } else if (n === 2) {
    msg = `${equalIco}Ex æquo ! <strong style="color:${winners[0].color}">${winners[0].nom}</strong> &amp; <strong style="color:${winners[1].color}">${winners[1].nom}</strong> — ${pts} pts chacun !`;
  } else if (n === 3) {
    msg = `${equalIco}Triple ex æquo ! ${winners.map(w=>`<strong style="color:${w.color}">${w.nom}</strong>`).join(', ')} — ${pts} pts chacun !`;
  } else {
    msg = `${equalIco}${n} ex æquo à ${pts} pts : ${winners.map(w=>`<strong style="color:${w.color}">${w.nom}</strong>`).join(', ')} !`;
  }

  openConfirm('Fin de partie', msg, () => showScreen('classement'), 'Voir le classement');
}

function removePlayer(pid) {
  if (!state || state.playerOrder.length<=2) { alert('Il faut au minimum 2 joueurs'); return; }
  const p = state.players.find(p=>p.id===pid);
  openConfirm('Supprimer ?', `Retirer "${p?p.nom:pid}" de la partie ?`, () => {
    state.players = state.players.filter(p=>p.id!==pid);
    state.playerOrder = state.playerOrder.filter(id=>id!==pid);
    state.manches.forEach(m => {
      m.joueurs = m.joueurs.filter(j=>j.id!==pid);
      m.butins = (m.butins||[]).filter(b=>b.playerA!==pid&&b.playerB!==pid);
    });
    delete state.cumuls[pid];
    recalcCumuls(0); saveGame(); renderCards();
    notify(`${p?p.nom:pid} retiré(e)`);
  });
}

function dragReorder(si, ti) {
  if (si===ti||si===null) return;
  const a = state.playerOrder; const [m] = a.splice(si,1); a.splice(ti,0,m);
  state.manches.forEach(mn => {
    const j = mn.joueurs.find(j=>j.id===m);
    mn.joueurs.splice(mn.joueurs.findIndex(j=>j.id===m),1);
    mn.joueurs.splice(a.indexOf(m),0,j);
  });
  dragSrc=null; renderCards(); sched();
}

// ──────────────────────────────────────────────────────────────
//  CLASSEMENT
// ──────────────────────────────────────────────────────────────
function showClassement() {
  if (!state) { alert('Aucune partie en cours'); return; }
  showScreen('classement');
}

const PIRATE_QUOTES = [
  '« Les mers lui appartiennent, que Neptune soit son témoin ! »',
  '« Nul ne peut défier son audace sur les flots ! »',
  '« Le Skull King lui-même s\'incline devant ce capitaine ! »',
  '« Les sirènes chantent son nom jusqu\'à l\'horizon ! »',
  '« Même Davy Jones a tremblé face à ce redoutable marin ! »',
];

function renderClassement() {
  if (!state) return;
  const li = state.config.manches - 1;
  const isComplete = state.maxReached >= state.config.manches;
  const rawScores = state.playerOrder.map(pid => ({
    pid, color: pColor(pid),
    nom: (state.players.find(p=>p.id===pid)||{}).nom||'?',
    score: state.cumuls[pid] ? (state.cumuls[pid][li]||0) : 0
  }));
  const ranked = computeRanks(rawScores);

  // Winner banner — handle ties at #1
  const banner = document.getElementById('winner-banner');
  if (banner) {
    if (isComplete && ranked.length) {
      const winners = ranked.filter(s => s.rank === 1);
      const quote = PIRATE_QUOTES[Math.floor(Math.random() * PIRATE_QUOTES.length)];
      const pts = winners[0].score;
      const n = winners.length;

      const namesList = winners
        .map(w => `<span style="color:${w.color}">${w.nom}</span>`)
        .join(n === 2 ? ' &amp; ' : n === 3 ? ', ' : ' · ');

      let title, score, quoteText;

      if (n === 1) {
        title = `La partie est terminée — Le vainqueur est…`;
        score = `${pts} points de butin — capitaine incontesté des sept mers !`;
        quoteText = quote;
      } else if (n === 2) {
        title = `La partie est terminée — Ex æquo au sommet !`;
        score = `${pts} points chacun — deux capitaines se partagent la mer !`;
        quoteText = `« Quand deux loups de mer s'affrontent à égalité, la mer elle-même ne peut trancher. »`;
      } else if (n === 3) {
        title = `La partie est terminée — Triple ex æquo !`;
        score = `${pts} points chacun — trois pirates, un seul trône, et personne pour l'occuper !`;
        quoteText = `« La mer ne peut servir trois maîtres à la fois… ou peut-être que si. »`;
      } else {
        title = `La partie est terminée — Égalité générale !`;
        score = `${pts} points chacun — ${n} capitaines ex æquo, la mer appartient à tous !`;
        quoteText = `« Jamais dans l'histoire des sept mers on n'avait vu pareille égalité. »`;
      }

      banner.classList.remove('hidden');
      banner.innerHTML = `
        <div class="wb-title">${title}</div>
        <div class="wb-name" style="${n===1?`color:${winners[0].color}`:'font-size:clamp(1rem,3vw,1.8rem)'}">${namesList}</div>
        <div class="wb-score">${score}</div>
        <div class="wb-quote">${quoteText}</div>`;
    } else {
      banner.classList.add('hidden');
    }
  }

  const tb = document.getElementById('cb'); tb.innerHTML = '';
  ranked.forEach(s => {
    const rc = rankClass(s.rank);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><span class="rb2 ${rc}">${s.rank}</span></td>
      <td><strong style="color:${s.color}">${s.nom}</strong></td>
      <td><strong style="color:${s.rank===1?'var(--gold)':'var(--text)'};font-size:1rem">${s.score}</strong> pts</td>`;
    tb.appendChild(tr);
  });
  renderChart();
}

// ──────────────────────────────────────────────────────────────
//  CHART
// ──────────────────────────────────────────────────────────────
function lastPlayedIdx() {
  let last = -1;
  for (let i=0; i<state.manches.length; i++) {
    const m = state.manches[i];
    if (m.joueurs.some(j => (parseInt(j.mise)||0)>0||(parseInt(j.plis)||0)>0||(parseInt(j.pirate)||0)>0)) last=i;
  }
  return Math.max(last, state.currentRound-1);
}

const CHART_LEGEND_LABELS = {
  color:'#e8a020', font:{family:'Cinzel',size:11}, padding:24,
  usePointStyle:true, pointStyle:'circle', boxWidth:10, boxHeight:10,
  generateLabels(ch) {
    return ch.data.datasets.map((ds,i) => ({
      text:ds.label, fillStyle:ds.borderColor, strokeStyle:ds.borderColor,
      fontColor:'#e8a020',
      lineWidth:0, hidden:false, index:i, datasetIndex:i, pointStyle:'circle'
    }));
  }
};
const CHART_SCALES = {
  x:{ ticks:{color:'#7a6545',font:{family:'Cinzel',size:10}}, grid:{display:false}, border:{display:false}},
  y:{ ticks:{color:'#7a6545',font:{family:'Cinzel',size:10}}, grid:{display:false}, border:{display:false}}
};

function renderChart() {
  if (chart) { chart.destroy(); chart=null; }
  const li = lastPlayedIdx();
  const count = li+1;
  const labels = Array.from({length:count},(_,i)=>'M'+(i+1));
  const datasets = state.playerOrder.map(pid => {
    const p = state.players.find(p=>p.id===pid);
    const c = pColor(pid);
    return { label:p?p.nom:pid, data:(state.cumuls[pid]||[]).slice(0,count),
      borderColor:c, backgroundColor:c, pointBackgroundColor:c, pointBorderColor:c,
      tension:0.4, cubicInterpolationMode:'monotone',
      pointRadius:5, pointHoverRadius:8, borderWidth:2.5, fill:false };
  });
  chart = new Chart(document.getElementById('sc2').getContext('2d'), {
    type:'line', data:{labels,datasets},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:CHART_LEGEND_LABELS }},
      scales: CHART_SCALES }
  });
}

function recommencer() {
  if (!state) { showScreen('home'); return; }
  openConfirm('Recommencer ?', 'La partie en cours sera supprimée définitivement.', () => {
    localStorage.removeItem(sk(state.id)); state=null; showScreen('home'); notify('Partie supprimée');
  });
}

function quitter() {
  if (state) saveGame();
  setTimeout(() => showScreen('home'), 150);
}

// ──────────────────────────────────────────────────────────────
//  CROSS-TAB LIVE SYNC
//  The 'storage' event fires in *other* tabs when localStorage changes.
//  This tab responds by refreshing the relevant screen.
// ──────────────────────────────────────────────────────────────
window.addEventListener('storage', e => {
  if (!e.key || !e.key.startsWith('skull_session_')) return;

  // Refresh home list whenever any session changes
  const home = document.getElementById('home');
  if (home && !home.classList.contains('hidden')) listSessions();

  // If this tab has the modified session loaded, sync state
  if (state && e.key === sk(state.id) && e.newValue) {
    try {
      const fresh = JSON.parse(e.newValue);
      if (!fresh) return;
      state = fresh;

      // Refresh compte screen (cards + side panel)
      const compte = document.getElementById('compte-col');
      if (compte && !compte.classList.contains('hidden')) {
        renderCards();
        if (splitView) renderSidePanel();
      }

      // Refresh classement screen
      const classement = document.getElementById('classement');
      if (classement && !classement.classList.contains('hidden')) {
        renderClassement();
      }
    } catch(_) {}
  }
});

/* ==== DEV TESTS START ==== */
// ──────────────────────────────────────────────────────────────
const ENABLE_DEV_TESTS = false;

function runDevTests() {
  // ── helpers ──────────────────────────────────────────────────
  let passed = 0, failed = 0;
  const assert = (id, got, expected, note='') => {
    const ok = got === expected;
    if (ok) passed++;
    else { failed++; console.error(`${id} FAIL — attendu ${expected}, obtenu ${got}${note?' ('+note+')':''}`); }
    console.log(`${id}: ${got} ${ok?'✅':'❌'}${note?' — '+note:''}`);
  };

  // Shorthand: build a minimal player data object for calcScore
  const J = (mise, plis, {p=0,sk=0,s=0,lev=0,g8=0,g7=0,g14c=0,g14b=0,bon=0,rascal=null,id='',butins=[]}={}) =>
    ({mise,plis,pirate:p,sk,sirene:s,leviathan:lev,got8:g8,got7:g7,got14color:g14c,got14black:g14b,bonus:bon,rascal,id,butins});

  console.group('Skull King DEV TESTS v3');

  // ── MAPPING des bonusEvents → champs app ──────────────────────
  // pirateCapturesMermaid (+20)  → pirate (p)
  // skullCapturesPirate   (+30)  → sirene (s)
  // mermaidCapturesSkull  (+40)  → sk
  // standard14            (+10)  → got14color (g14c)
  // black14               (+20)  → got14black (g14b)

  console.groupCollapsed('── BASE (T01–T11) ──');

  // T01: bid=0 réussi, N=1 → +10
  assert('T01', calcScore(J(0,0),1), 10, 'bid=0 réussi, N=1');
  // T02: bid=1 réussi, N=1 → +20
  assert('T02', calcScore(J(1,1),1), 20, 'bid=1 réussi, N=1');
  // T03: bid=2 réussi, N=4 → +40
  assert('T03', calcScore(J(2,2),4), 40, 'bid=2 réussi, N=4');
  // T04: bid=10 réussi, N=10 → +200
  assert('T04', calcScore(J(10,10),10), 200, 'bid=10 réussi, N=10');
  // T05: bid=2, tricks=1 → -10
  assert('T05', calcScore(J(2,1),3), -10, 'bid=2 tricks=1');
  // T06: bid=2, tricks=3 → -10
  assert('T06', calcScore(J(2,3),3), -10, 'bid=2 tricks=3');
  // T07: bid=4, tricks=1 → -30
  assert('T07', calcScore(J(4,1),6), -30, 'bid=4 tricks=1');
  // T08: bid=7, tricks=9 → -20
  assert('T08', calcScore(J(7,9),9), -20, 'bid=7 tricks=9');
  // T09: bid=0 raté (1 pli pris), N=5 → -50  ← pénalité fixe = -10×N
  assert('T09', calcScore(J(0,1),5), -50, 'bid=0 raté 1 pli N=5');
  // T10: bid=0 raté (4 plis pris), N=8 → -80
  assert('T10', calcScore(J(0,4),8), -80, 'bid=0 raté 4 plis N=8');
  // T11: bid=0 raté (1 pli), N=8 → -80  (indépendant du nb de plis pris)
  assert('T11', calcScore(J(0,1),8), -80, 'bid=0 raté 1 pli N=8');

  console.groupEnd();
  console.groupCollapsed('── BONUS (T12–T25) ──');

  // T12: standard14×1 → 40+10=50
  assert('T12', calcScore(J(2,2,{g14c:1}),4), 50, 'standard14×1');
  // T13: black14×1 → 40+20=60
  assert('T13', calcScore(J(2,2,{g14b:1}),4), 60, 'black14×1');
  // T14: standard14×2 + black14×1 → 60+20+20=100
  assert('T14', calcScore(J(3,3,{g14c:2,g14b:1}),5), 100, 'standard14×2 + black14×1');
  // T15: pirateCapturesMermaid×1 → 20+20=40
  assert('T15', calcScore(J(1,1,{p:1}),6), 40, 'pirateCapturesMermaid×1');
  // T16: pirateCapturesMermaid×2 → 20+40=60
  assert('T16', calcScore(J(1,1,{p:2}),6), 60, 'pirateCapturesMermaid×2');
  // T17: skullCapturesPirate×1 → 20+30=50
  assert('T17', calcScore(J(1,1,{s:1}),6), 50, 'skullCapturesPirate×1');
  // T18: skullCapturesPirate×3 → 40+90=130
  assert('T18', calcScore(J(2,2,{s:3}),8), 130, 'skullCapturesPirate×3');
  // T19: mermaidCapturesSkull×1 → 20+40=60
  assert('T19', calcScore(J(1,1,{sk:1}),8), 60, 'mermaidCapturesSkull×1');
  // T20: mermaidCapturesSkull×1 + standard14×1 → 20+40+10=70
  assert('T20', calcScore(J(1,1,{sk:1,g14c:1}),8), 70, 'mermaidCapturesSkull×1 + standard14×1');
  // T21: standard14×2 + black14×1 + pirateCapturesMermaid×1 → 80+20+20+20=140
  assert('T21', calcScore(J(4,4,{g14c:2,g14b:1,p:1}),9), 140, 'standard14×2 + black14×1 + pirateCapturesMermaid×1');
  // T22: bid raté → tous les bonus tombent → -10
  assert('T22', calcScore(J(4,3,{g14c:2,g14b:1,p:1}),9), -10, 'bid raté bonus=0');
  // T23: mermaidCapturesSkull×1 + standard14×1 (SK ne gagne pas le pli) → 20+40+10=70
  assert('T23', calcScore(J(1,1,{sk:1,g14c:1}),5), 70, 'sirène capture SK + 14 couleur');
  // T24: pirateCapturesMermaid×2 + black14×1 → 20+40+20=80
  assert('T24', calcScore(J(1,1,{p:2,g14b:1}),5), 80, 'pirateCapturesMermaid×2 + black14×1');
  // T25: skullCapturesPirate×2 + standard14×1 → 20+60+10=90
  assert('T25', calcScore(J(1,1,{s:2,g14c:1}),5), 90, 'skullCapturesPirate×2 + standard14×1');

  console.groupEnd();
  console.groupCollapsed('── SCÉNARIO S1 — 3 joueurs 4 manches ──');

  // Mapping des bonus events → scores attendus par joueur par manche
  // R1 N=1: A:20 B:10 C:10 | R2 N=2: A:-20 B:30 C:-10 | R3 N=3: A:60 B:30 C:20 | R4 N=4: A:20 B:80 C:20
  const s1State = {
    playerOrder:['a','b','c'],
    players:[{id:'a',nom:'A',color:'#f00'},{id:'b',nom:'B',color:'#0f0'},{id:'c',nom:'C',color:'#00f'}],
    config:{manches:4},
    manches:[
      {N:1,butins:[],joueurs:[
        {id:'a',...J(1,1)},{id:'b',...J(0,0)},{id:'c',...J(0,0)},
      ]},
      {N:2,butins:[],joueurs:[
        {id:'a',...J(0,1)},{id:'b',...J(1,1,{g14c:1})},{id:'c',...J(1,0)},
      ]},
      {N:3,butins:[],joueurs:[
        {id:'a',...J(2,2,{g14b:1})},{id:'b',...J(0,0)},{id:'c',...J(1,1)},
      ]},
      {N:4,butins:[],joueurs:[
        {id:'a',...J(1,1)},{id:'b',...J(2,2,{sk:1})},{id:'c',...J(1,1)},
      ]},
    ],
    cumuls:{a:[0,0,0,0],b:[0,0,0,0],c:[0,0,0,0]}
  };
  // Calculer les scores manches
  s1State.manches.forEach((m,i) => {
    m.joueurs.forEach(jd => { jd.score = calcScore(jd, i+1); });
  });
  // R1 scores
  assert('S1-R1-A-score', s1State.manches[0].joueurs.find(j=>j.id==='a').score, 20, 'R1 A bid=1 ok');
  assert('S1-R1-B-score', s1State.manches[0].joueurs.find(j=>j.id==='b').score, 10, 'R1 B bid=0 ok');
  assert('S1-R1-C-score', s1State.manches[0].joueurs.find(j=>j.id==='c').score, 10, 'R1 C bid=0 ok');
  // R2 scores
  assert('S1-R2-A-score', s1State.manches[1].joueurs.find(j=>j.id==='a').score, -20, 'R2 A bid=0 raté N=2');
  assert('S1-R2-B-score', s1State.manches[1].joueurs.find(j=>j.id==='b').score, 30, 'R2 B bid=1 ok + std14');
  assert('S1-R2-C-score', s1State.manches[1].joueurs.find(j=>j.id==='c').score, -10, 'R2 C bid=1 raté');
  // R3 scores
  assert('S1-R3-A-score', s1State.manches[2].joueurs.find(j=>j.id==='a').score, 60, 'R3 A bid=2 ok + black14');
  assert('S1-R3-B-score', s1State.manches[2].joueurs.find(j=>j.id==='b').score, 30, 'R3 B bid=0 ok N=3');
  assert('S1-R3-C-score', s1State.manches[2].joueurs.find(j=>j.id==='c').score, 20, 'R3 C bid=1 ok');
  // R4 scores
  assert('S1-R4-A-score', s1State.manches[3].joueurs.find(j=>j.id==='a').score, 20, 'R4 A bid=1 ok');
  assert('S1-R4-B-score', s1State.manches[3].joueurs.find(j=>j.id==='b').score, 80, 'R4 B bid=2 ok + mermaidSK');
  assert('S1-R4-C-score', s1State.manches[3].joueurs.find(j=>j.id==='c').score, 20, 'R4 C bid=1 ok');
  // Cumuls
  const sv1 = state; state = s1State;
  recalcCumuls(0);
  assert('S1-A-total', s1State.cumuls.a[3], 80,  'A cumul final');
  assert('S1-B-total', s1State.cumuls.b[3], 150, 'B cumul final');
  assert('S1-C-total', s1State.cumuls.c[3], 40,  'C cumul final');
  // Intermédiaires
  assert('S1-A-R2', s1State.cumuls.a[1], 0,   'A après R2');
  assert('S1-B-R2', s1State.cumuls.b[1], 40,  'B après R2');
  assert('S1-A-R3', s1State.cumuls.a[2], 60,  'A après R3');
  assert('S1-B-R3', s1State.cumuls.b[2], 70,  'B après R3');
  state = sv1;

  console.groupEnd();
  console.groupCollapsed('── SCÉNARIO S2 — N=6, 10 joueurs, totaux de départ inclus ──');

  // Scores par joueur pour la manche N=6
  // J1: bid=1/1 → +20          J2: bid=0/0 → +60
  // J3: bid=2/2 + black14 → +60 J4: bid=1/0 → -10
  // J5: bid=0/1 → -60           J6: bid=1/1 + pirateCapturesMermaid×1 → +40
  // J7: bid=1/1 + skullCapturesPirate×2 → +80  J8: bid=0/0 → +60
  // J9: bid=0/0 → +60           J10: bid=0/0 → +60

  const s2 = [
    {id:'j1', mise:1,plis:1},
    {id:'j2', mise:0,plis:0},
    {id:'j3', mise:2,plis:2, got14black:1},
    {id:'j4', mise:1,plis:0},
    {id:'j5', mise:0,plis:1},   // bid=0 raté → -60
    {id:'j6', mise:1,plis:1, pirate:1},
    {id:'j7', mise:1,plis:1, sirene:2},
    {id:'j8', mise:0,plis:0},
    {id:'j9', mise:0,plis:0},
    {id:'j10',mise:0,plis:0},
  ].map(j => ({...J(j.mise,j.plis,{p:j.pirate||0,s:j.sirene||0,g14b:j.got14black||0}), id:j.id}));

  const s2Expected = [20, 60, 60, -10, -60, 40, 80, 60, 60, 60];
  const s2StartTotals = [0, 10, -20, 50, 0, 30, 40, -10, 0, 100];
  const s2FinalTotals = [20, 70, 40, 40, -60, 70, 120, 50, 60, 160];

  s2.forEach((jd, i) => {
    const score = calcScore(jd, 6);
    assert(`S2-J${i+1}-round`, score, s2Expected[i], `J${i+1} bid=${jd.mise} tricks=${jd.plis}`);
    assert(`S2-J${i+1}-total`, s2StartTotals[i] + score, s2FinalTotals[i], `J${i+1} total final`);
  });

  console.groupEnd();
  console.groupCollapsed('── VALIDATIONS TRANSVERSES ──');

  // V01 — roundPoints = bidPoints + bonusPoints  (implicite dans tous les calcScore ci-dessus)
  // V02 — sum(tricksWon) = cardsDealt sur une manche complète
  const s1m3 = s1State.manches[2].joueurs;
  const sumPlis3 = s1m3.reduce((acc,j) => acc + (parseInt(j.plis)||0), 0);
  assert('V02-S1-R3-sum-plis', sumPlis3, 3, 'somme plis R3 = cardsDealt');

  // V03 — cardsDealt != round possible (ex. format multi-joueurs où N≠cardsDealt)
  // Ici on teste N=6 mais cardsDealt=6 (identiques); on vérifie que la pénalité bid=0 utilise bien N
  assert('V03-bid0-fail-N=6', calcScore(J(0,1),6), -60, 'bid=0 raté N=6');
  assert('V03-bid0-ok-N=6',   calcScore(J(0,0),6), 60,  'bid=0 ok N=6');

  // V04 — cumul peut descendre en dessous de zéro
  assert('V04-negative-total', s2FinalTotals[4], -60, 'J5 total négatif autorisé');
  const negCumul = -80 + (-10); // deux manches négatives consécutives
  assert('V04-double-negative', negCumul, -90, 'cumul doublement négatif');

  // V05 — rascal n'affecte pas bid=0 fail (extension futur, vérification actuelle)
  assert('V05-rascal-bid0-fail', calcScore({...J(0,2), rascal:20},5), -50, 'rascal ignoré si bid=0 raté');

  console.groupEnd();

  console.log(`\n══ RÉSULTAT: ${passed} ✅ / ${passed+failed} tests — ${failed===0?'TOUS OK':''+failed+' ÉCHEC(S)'} ══`);
  console.groupEnd();
}

if (ENABLE_DEV_TESTS) runDevTests();
// ──────────────────────────────────────────────────────────────
